<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" width="80" height="64" role="img" aria-labelledby="t d">
  <title id="t">Andrade Parra Corporation</title>
  <desc id="d">Monograma A P: la pata derecha de la A es el mismo montante del que nace el cuenco de la P; el travesaño de la A actua de tirante.</desc>
  <!--
    Isotipo AP. La A lleva travesano a proposito: sin el, el conjunto se leia "/P".
    El rojo va solo en el travesano, rodeado de azul, para que el simbolo no se
    fragmente en dos objetos sueltos.
  -->
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 42.5 H41.5" stroke="#F0692A"/>
    <path d="M11 54 L46 10 V54" stroke="#1B2A4A"/>
    <path d="M46 15 H56 A11.5 11.5 0 0 1 56 38 H46" stroke="#1B2A4A"/>
  </g>
</svg>
