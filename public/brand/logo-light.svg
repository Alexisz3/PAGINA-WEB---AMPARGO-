  <title id="t">Andrade Parra Corporation — General Remodeling</title>
  <desc id="d">Monograma A P: la pata derecha de la A es el mismo montante del que nace el cuenco de la P; el travesaño de la A actua de tirante. Version en blanco marfil para fondos oscuros.</desc>
  <!--
    El travesano conserva el rojo: sobre carbon mantiene 4,6:1 y es la unica
    nota de color que sobrevive a la inversion sin ensuciar el conjunto.
